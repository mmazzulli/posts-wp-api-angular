<div class="container">

  <div *ngFor="let post of posts" class="post-card">

    <!-- IMAGEM -->
    <div
      class="post-image"
      *ngIf="post._embedded?.['wp:featuredmedia']?.[0]"
    >

      <img
        [src]="post._embedded?.['wp:featuredmedia']?.[0]?.source_url"
        [alt]="post.title.rendered"
      >

    </div>

    <!-- CONTEÚDO -->
    <div class="post-info">

      <!-- TÍTULO -->
      <h2 class="post-title">

        <a
          [href]="post.link"
          target="_blank"
          rel="noopener"
        >

          <span [innerHTML]="post.title.rendered"></span>

        </a>

      </h2>

      <!-- RESUMO -->
      <div class="post-description">

        <p
          [innerHTML]="
            post.excerpt?.rendered
            || (post.content.rendered | slice:0:220) + '...'
          "
        ></p>

      </div>

      <!-- BOTÃO -->
      <a
        class="read-more"
        [href]="post.link"
        target="_blank"
        rel="noopener"
      >
        Ler artigo completo
      </a>

    </div>

  </div>

</div>
